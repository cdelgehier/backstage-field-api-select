---
name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog section
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          CHANGELOG_SECTION=$(awk -v tag="$TAG" '
            /^## v/ {
              if (found) exit
              if ($2 == tag) found=1
              next
            }
            found {print}
          ' CHANGELOG.md)

          if [ -z "$CHANGELOG_SECTION" ]; then
            CHANGELOG_SECTION=$(cat CHANGELOG.md)
          fi

          echo "$CHANGELOG_SECTION" > release_notes.md

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies and build
        run: task install && task build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "✅ GitHub Release created for $TAG" >> $GITHUB_STEP_SUMMARY
          echo "📦 Published to npm: backstage-field-api-select@${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
